services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lejiend-assignment-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    networks:
      - lejiend-cicd-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  lejiend-cicd-network:
    external: true
    name: lejiend-cicd-network
